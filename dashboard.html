<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stalker Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
    <style>
        /* Login - multi portal */
        #saved-portals { list-style: none; padding: 0; margin: 10px 0; width: 100%; max-width: 400px; }
        #saved-portals li { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; margin: 4px 0; background: #222; border-radius: 4px; cursor: pointer; }
        #saved-portals li:hover { background: #333; }
        #saved-portals li .del { color: #f55; cursor: pointer; font-weight: bold; padding: 0 6px; }
        .portal-form { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 400px; }
        .portal-form input { padding: 8px; border: 1px solid #444; border-radius: 4px; background: #222; color: #fff; }
        .portal-form button { padding: 8px; border: none; border-radius: 4px; background: #0a7; color: #fff; cursor: pointer; font-weight: bold; }
        .portal-form button:hover { background: #0c9; }

        /* Main layout */
        #main-menu .app-layout { display: flex; width: 100%; height: 100%; }
        #main-menu .sidebar { width: 60px; min-width: 60px; background: #1a1a1a; display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 4px; }
        #main-menu .sidebar button { width: 44px; height: 44px; border: none; border-radius: 6px; background: transparent; color: #888; font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
        #main-menu .sidebar button.active { background: #0a7; color: #fff; }
        #main-menu .sidebar button:hover { color: #fff; }
        #main-menu .sidebar button img { width: 22px; height: 22px; filter: invert(0.5); }
        #main-menu .sidebar button.active img { filter: invert(1); }
        #main-menu .sidebar button span { font-size: 9px; }

        /* Content area */
        #main-menu .content-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        #main-menu .content-header { display: flex; align-items: center; padding: 8px 12px; gap: 10px; background: #1a1a1a; border-bottom: 1px solid #222; }
        #main-menu .content-header h2 { margin: 0; font-size: 16px; flex-shrink: 0; }
        #main-menu .content-header input { flex: 1; max-width: 300px; padding: 6px 10px; border: 1px solid #444; border-radius: 4px; background: #222; color: #fff; font-size: 13px; }
        #main-menu .category-bar { display: flex; gap: 4px; padding: 6px 12px; background: #151515; overflow-x: auto; flex-shrink: 0; }
        #main-menu .category-bar button { padding: 4px 12px; border: 1px solid #333; border-radius: 12px; background: transparent; color: #aaa; cursor: pointer; font-size: 12px; white-space: nowrap; }
        #main-menu .category-bar button.active { background: #0a7; color: #fff; border-color: #0a7; }
        #main-menu .category-bar button:hover { color: #fff; }

        /* Channel/movie list + preview */
        #main-menu .body-area { display: flex; flex: 1; overflow: hidden; }
        #main-menu .list-panel { width: 45%; min-width: 280px; overflow-y: auto; border-right: 1px solid #222; }
        #main-menu .list-panel ul { list-style: none; padding: 0; margin: 0; }
        #main-menu .list-panel ul li { padding: 8px 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #1a1a1a; font-size: 13px; }
        #main-menu .list-panel ul li:hover { background: #222; }
        #main-menu .list-panel ul li.selected { background: #0a73; border-left: 3px solid #0a7; }
        #main-menu .list-panel ul li .fav { margin-left: auto; color: #666; cursor: pointer; font-size: 16px; padding: 0 4px; }
        #main-menu .list-panel ul li .fav.on { color: #fa0; }
        #main-menu .list-panel ul li img { width: 24px; height: 24px; object-fit: contain; border-radius: 2px; flex-shrink: 0; }
        #main-menu .list-panel ul li .num { color: #666; font-size: 11px; min-width: 28px; }

        /* Preview panel */
        #main-menu .preview-panel { flex: 1; display: flex; flex-direction: column; background: #0a0a0a; }
        #main-menu .preview-panel .video-wrap { position: relative; flex: 1; min-height: 200px; background: #000; display: flex; align-items: center; justify-content: center; }
        #main-menu .preview-panel .video-wrap video { width: 100%; height: 100%; object-fit: contain; }
        #main-menu .preview-panel .video-wrap .fs-btn { position: absolute; bottom: 10px; right: 10px; z-index: 10; background: rgba(0,0,0,0.6); color: #fff; border: 1px solid rgba(255,255,255,0.3); border-radius: 4px; padding: 6px 12px; font-size: 18px; cursor: pointer; opacity: 0.7; }
        #main-menu .preview-panel .video-wrap .fs-btn:hover { opacity: 1; }
        #main-menu .preview-panel .epg { padding: 8px 12px; background: #111; flex-shrink: 0; }
        #main-menu .preview-panel .epg .title { font-weight: bold; font-size: 14px; }
        #main-menu .preview-panel .epg .desc { color: #888; font-size: 12px; margin-top: 4px; }

        /* Player screen */
        #player-screen { background: #000; justify-content: flex-start; align-items: stretch; padding: 0; }
        #player-screen #video-player { width: 100%; height: 100%; object-fit: contain; background: #000; }
        #player-screen .plyr-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: flex-end; }
        #player-screen .plyr-overlay .ctrl-bar { pointer-events: auto; display: flex; align-items: center; padding: 8px 12px; background: linear-gradient(transparent, rgba(0,0,0,0.8)); gap: 10px; }
        #player-screen .plyr-overlay .ctrl-bar button { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; padding: 4px 8px; }
        #player-screen .plyr-overlay .ctrl-bar .vlink { font-size: 12px; color: #0af; text-decoration: underline; cursor: pointer; }
        #player-screen .plyr-overlay .top-bar { pointer-events: auto; display: flex; justify-content: space-between; padding: 8px 12px; background: linear-gradient(rgba(0,0,0,0.8), transparent); }
        #player-screen .plyr-overlay .top-bar button { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
        #player-screen .plyr-overlay .status-msg { pointer-events: auto; text-align: center; padding: 20px; color: #aaa; font-size: 14px; }

        /* Movie grid */
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; padding: 8px; overflow-y: auto; }
        .movie-grid .card { cursor: pointer; border-radius: 4px; overflow: hidden; background: #1a1a1a; transition: transform 0.15s; }
        .movie-grid .card:hover { transform: scale(1.03); }
        .movie-grid .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .movie-grid .card .name { padding: 6px; font-size: 12px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Spinner */
        .spinner { width: 40px; height: 40px; border: 3px solid #333; border-top-color: #0a7; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 20px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* info-banner inside player */
        .info-banner { position: absolute; top: 50px; left: 20px; right: 20px; padding: 12px 16px; background: rgba(0,0,0,0.85); border-radius: 8px; display: flex; align-items: center; gap: 12px; pointer-events: none; transition: opacity 0.3s; }
        .info-banner.hidden2 { opacity: 0; }
        .info-banner img { width: 48px; height: 48px; object-fit: contain; border-radius: 4px; }
        .info-banner .ch-info .ch-name { font-size: 18px; font-weight: bold; }
        .info-banner .ch-info .ch-prog { font-size: 13px; color: #aaa; }

        @media (max-width: 768px) {
            #main-menu .body-area { flex-direction: column; }
            #main-menu .list-panel { width: 100%; min-width: unset; max-height: 50%; border-right: none; border-bottom: 1px solid #222; }
            #main-menu .preview-panel .video-wrap { min-height: 140px; }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Login Screen -->
        <div id="login-screen" class="screen">
            <h1>Stalker Dashboard</h1>
            <form class="portal-form" id="login-form" autocomplete="off">
                <input type="url" id="portal-url" placeholder="Portal URL (e.g. http://iptv-server.com)" required>
                <input type="text" id="mac-address" placeholder="MAC Address (e.g. 00:1A:79:XX:XX:XX)" required>
                <input type="text" id="username" placeholder="Username (optional)">
                <input type="password" id="password" placeholder="Password (optional)">
                <input type="text" id="portal-name" placeholder="Portal name (e.g. My TV)">
                <button type="submit">Connect</button>
            </form>
            <ul id="saved-portals"></ul>
            <div id="status-message" style="margin-top: 10px; font-size: 13px;"></div>
        </div>

        <!-- Loading Screen -->
        <div id="loading-screen" class="screen hidden">
            <div class="spinner"></div>
            <div id="loading-message" style="margin-top: 12px; color: #aaa;">Loading...</div>
        </div>

        <!-- Main Menu -->
        <div id="main-menu" class="screen hidden">
            <div class="app-layout">
                <!-- Sidebar -->
                <div class="sidebar">
                    <button id="mode-tv" class="active" title="TV Channels"><img src="css/icons/tv.svg" alt="TV"><span>TV</span></button>
                    <button id="mode-series" title="Series"><img src="css/icons/film.svg" alt="Series"><span>Series</span></button>
                    <button id="mode-movies" title="Movies"><img src="css/icons/film.svg" alt="Movies"><span>Movies</span></button>
                    <button id="mode-fav" title="Favorites"><span style="font-size:20px;">★</span><span>Fav</span></button>
                    <button id="mode-settings" title="Switch Portal"><span style="font-size:18px;">⚙</span><span>Portal</span></button>
                </div>

                <!-- Content -->
                <div class="content-area">
                    <div class="content-header">
                        <h2 id="list-title">Channels</h2>
                        <input type="text" id="channel-search" placeholder="Search...">
                    </div>

                    <!-- Category bar -->
                    <div id="category-bar" class="category-bar"></div>

                    <!-- Body -->
                    <div class="body-area">
                        <!-- List panel -->
                        <div class="list-panel">
                            <ul id="content-list"></ul>
                        </div>

                        <!-- Preview panel -->
                        <div class="preview-panel">
                            <div class="video-wrap">
                                <video id="preview-player" muted></video>
                                <button id="preview-fs-btn" class="fs-btn hidden">⛶</button>
                            </div>
                            <div class="epg">
                                <div class="title" id="epg-title"></div>
                                <div class="desc" id="epg-desc"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Player Screen -->
        <div id="player-screen" class="screen hidden">
            <video id="video-player" autoplay controls style="width:100%;height:100%;"></video>
            <div id="player-loader" class="hidden" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);">
                <div class="spinner"></div>
            </div>
            <div id="info-banner" class="info-banner hidden2">
                <img id="banner-logo" src="" alt="">
                <div class="ch-info">
                    <div class="ch-name" id="banner-channel-name"></div>
                    <div class="ch-prog" id="banner-program-title"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/stalker.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
